apiVersion: v1
kind: ConfigMap
metadata: 
  name: mosquitto-config-file
data:
  mosquitto.conf: |
    log_dest stdout
    log_type all
    log_timestamp true
    listener 9001
---
apiVersion: v1
kind: Secret
metadata: 
  name: mosquitto-secret-file
type: Opaque
data:
  secret.file: dGVzdHVzZXI6dGVzdHBhc3M=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels:
    app: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:latest
        ports:
        - containerPort: 1883
        volumeMounts:
        - name: mosquitto-conf
          mountPath: /mosquitto/config
        - name: mosquitto-secret
          mountPath: /mosquitto/secret
          readOnly: true
      volumes:   # <-- lowercase 'volumes', indented to match 'containers'
      - name: mosquitto-conf
        configMap:
          name: mosquitto-config-file
      - name: mosquitto-secret
        secret:
          secretName: mosquitto-secret-file
---
# Deployment without volumes (for comparison)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto-w0vol
  labels:
    app: mosquitto-w0vol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto-w0vol
  template:
    metadata:
      labels:
        app: mosquitto-w0vol
    spec:
      containers:
      - name: mosquitto-w0vol
        image: eclipse-mosquitto:latest
        ports:
        - containerPort: 1883
